<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TP Open House Chatbot</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f3f4f6;

      display: flex;

      justify-content: center;

      align-items: center;

      height: 100vh;

      padding: 16px;
    }


    /* ==========================================
       CHATBOT CONTAINER
       ========================================== */

    .chat-container {

      width: 100%;

      max-width: 430px;

      height: 700px;

      max-height: 90vh;

      background: white;

      border-radius: 16px;

      box-shadow: 0 10px 25px rgba(0,0,0,0.1);

      display: flex;

      flex-direction: column;

      overflow: hidden;
    }


    /* ==========================================
       HEADER
       ========================================== */

    .header {

      background: #dc2626;

      color: white;

      padding: 16px;

      flex-shrink: 0;
    }


    .header h2 {

      margin: 0;

      font-size: 18px;
    }


    .header p {

      margin: 4px 0 0;

      font-size: 12px;

      opacity: 0.9;
    }


    /* ==========================================
       CHAT MESSAGE AREA
       ========================================== */

    .chat-box {

      flex: 1;

      min-height: 0;

      padding: 12px;

      overflow-y: auto;

      background: #f9fafb;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    /* ==========================================
       MESSAGES
       ========================================== */

    .msg {

      padding: 10px 12px;

      border-radius: 12px;

      max-width: 75%;

      font-size: 14px;

      white-space: normal;

      word-wrap: break-word;

      line-height: 1.4;
    }


    .user {

      background: #dc2626;

      color: white;

      align-self: flex-end;
    }


    .bot {

      background: white;

      border: 1px solid #e5e7eb;

      align-self: flex-start;
    }


    .bot p {

      margin: 0.4em 0;
    }


    .bot ul,

    .bot ol {

      margin: 0.4em 0;

      padding-left: 20px;
    }


    .bot strong {

      font-weight: bold;
    }


    /* ==========================================
       SUGGESTED QUESTIONS
       ========================================== */

    .suggestions {

      background: #f9fafb;

      padding: 4px 12px 12px;

      flex-shrink: 0;
    }


    .suggestions-title {

      font-size: 12px;

      color: #6b7280;

      margin-bottom: 8px;
    }


    .suggestion-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;
    }


    .suggestion-btn {

      background: white;

      color: #374151;

      border: 1px solid #d1d5db;

      border-radius: 16px;

      padding: 7px 10px;

      font-size: 12px;

      cursor: pointer;

      transition: background 0.15s, border-color 0.15s;
    }


    .suggestion-btn:hover {

      background: #f3f4f6;

      border-color: #9ca3af;
    }


    /* ==========================================
       INPUT AREA
       ========================================== */

    .input-area {

      display: flex;

      border-top: 1px solid #e5e7eb;

      flex-shrink: 0;

      background: white;
    }


    input {

      flex: 1;

      min-width: 0;

      padding: 12px;

      border: none;

      outline: none;

      font-size: 14px;
    }


    .send-button {

      background: #dc2626;

      color: white;

      border: none;

      padding: 12px 16px;

      cursor: pointer;

      font-size: 14px;

      flex-shrink: 0;
    }


    .send-button:hover {

      background: #b91c1c;
    }


    /* ==========================================
       TYPING INDICATOR
       ========================================== */

    .typing {

      font-size: 12px;

      color: gray;

      padding: 0 12px 8px;

      flex-shrink: 0;

      background: #f9fafb;
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 480px) {

      body {

        padding: 0;

        align-items: stretch;
      }


      .chat-container {

        width: 100%;

        max-width: 430px;

        height: 100vh;

        max-height: none;

        border-radius: 0;

        box-shadow: none;
      }

    }

  </style>

</head>


<body>


<div class="chat-container">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <h2>TP Open House Chatbot</h2>

    <p>Ask about Temasek Polytechnic CCAs</p>

  </div>


  <!-- ==========================================
       CHAT MESSAGES
       ========================================== -->

  <div id="chat" class="chat-box"></div>


  <!-- ==========================================
       SUGGESTED QUESTIONS
       ========================================== -->

  <div id="suggestions" class="suggestions">

    <div class="suggestions-title">
      Try asking:
    </div>


    <div class="suggestion-buttons">

      <button
        class="suggestion-btn"
        onclick="useSuggestion('Show me sports CCAs')"
      >
        Show me sports CCAs
      </button>


      <button
        class="suggestion-btn"
        onclick="useSuggestion('I like technology')"
      >
        I like technology
      </button>


      <button
        class="suggestion-btn"
        onclick="useSuggestion('When does Mind Sports train?')"
      >
        When does Mind Sports train?
      </button>


      <button
        class="suggestion-btn"
        onclick='useSuggestion("I don&#39;t like singing")'
      >
        I don't like singing
      </button>

    </div>

  </div>


  <!-- ==========================================
       TYPING INDICATOR
       ========================================== -->

  <div id="typing" class="typing"></div>


  <!-- ==========================================
       INPUT
       ========================================== -->

  <div class="input-area">

    <input
      id="input"
      type="text"
      placeholder="Ask something..."
    />

    <button
      class="send-button"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>


</div>


<!-- Load markdown library FIRST -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<script>

  const chatBox = document.getElementById("chat");

  const input = document.getElementById("input");

  const typing = document.getElementById("typing");

  const suggestions = document.getElementById("suggestions");


  // Store conversation history

  let chatHistory = [];


  // ==========================================
  // ADD MESSAGE
  // ==========================================

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.classList.add("msg", type);


    if (type === "bot") {

      div.innerHTML = marked.parse(text);

    } else {

      div.innerText = text;

    }


    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;

  }


  // ==========================================
  // SUGGESTED QUESTION
  // ==========================================

  function useSuggestion(question) {

    input.value = question;

    sendMessage();

  }


  // ==========================================
  // SEND MESSAGE
  // ==========================================

  async function sendMessage() {

    const message = input.value.trim();


    if (!message) return;


    // Hide suggestions after the user starts chatting

    suggestions.style.display = "none";


    addMessage(message, "user");

    input.value = "";


    typing.innerText = "Bot is thinking...";


    try {


      const res = await fetch(

        "https://tp-cca-chatbot.onrender.com/chat",

        {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify({

            message: message,

            history: chatHistory.slice(-10)

          })

        }

      );


      const data = await res.json();


      typing.innerText = "";


      if (data.success) {


        addMessage(data.response, "bot");


        // Save conversation history

        chatHistory.push({

          role: "user",

          content: message

        });


        chatHistory.push({

          role: "assistant",

          content: data.response

        });


      } else {


        addMessage(

          data.response || "Unknown error",

          "bot"

        );

      }


    } catch (err) {


      typing.innerText = "";


      addMessage(

        "Cannot connect to server 😢",

        "bot"

      );


      console.error(err);

    }

  }


  // ==========================================
  // ENTER KEY
  // ==========================================

  input.addEventListener("keypress", function (e) {

    if (e.key === "Enter") {

      sendMessage();

    }

  });


  // ==========================================
  // WELCOME MESSAGE
  // ==========================================

  addMessage(

    "**Hi! 👋 I'm the TP CCA Assistant.**\n\n" +
    "Ask me about CCAs, training schedules, activities, " +
    "or tell me what you're looking for and I'll help " +
    "you find suitable options!",

    "bot"

  );

</script>


</body>

</html>
